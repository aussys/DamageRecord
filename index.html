<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Damage Video Terminal</title>
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Barcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans tracking-tight pb-12">

  <main class="max-w-md mx-auto px-4 py-6 space-y-4">
    <!-- Step 1: Configuration Form -->
    <div id="config-card" class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-xl">
      <!-- Target Folder Selector -->
      <div>
        <label for="folderSelect" class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5 pl-0.5">
          Target Storage Directory
        </label>
        <div class="flex gap-2">
          <div class="relative flex-1">
            <select id="folderSelect" class="w-full bg-slate-900 border border-slate-800 text-slate-100 font-semibold rounded-xl h-12 px-3.5 appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm">
              <option value="1">Damage Form [1]</option>
              <option value="2">Damage Form [2]</option>
            </select>
            <div class="absolute right-3.5 top-1/2 -not-sr-only -translate-y-1/2 pointer-events-none text-slate-400">
              <i data-lucide="folder" class="w-4 h-4"></i>
            </div>
          </div>
          <button id="lockBtn" class="px-4.5 rounded-xl flex items-center justify-center gap-2 border text-xs font-bold transition-all h-12 bg-slate-900 border-slate-800 text-slate-300 active:scale-95">
            <i data-lucide="lock" class="w-4 h-4"></i>
            <span id="lockBtnText">Lock</span>
          </button>
        </div>
      </div>

      <!-- Identifier input -->
      <div>
        <label for="folderName" class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-1.5 pl-0.5">
          Inspection Identifier / ID code
        </label>
        <div class="flex gap-2">
          <input id="folderName" type="text" autocomplete="off" placeholder="4 Digit ID atau scan barcode" class="flex-1 bg-slate-900 border border-slate-800 text-slate-100 rounded-xl h-12 px-3.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm placeholder:text-slate-500">
          
          <button id="scanBtn" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-extrabold text-xs uppercase tracking-wider rounded-xl px-4 flex items-center justify-center gap-1.5 transition-all shadow-lg border border-indigo-505 h-12">
            <i data-lucide="camera" class="w-4 h-4"></i>
            <span>ScanID</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Step 2: Main Camera / Recorder console -->
    <div id="recorder-card" class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 space-y-3.5 shadow-xl">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest pl-0.5">Media capture console</span>
        <span id="recordingIndicator" class="hidden flex items-center gap-1 bg-red-950/80 border border-red-900 text-red-400 text-[10px] font-extrabold font-mono px-2 py-0.5 rounded-full animate-pulse">
          <i data-lucide="circle-dot" class="w-3 h-3 text-red-500"></i>
          <span id="timerTxt">REC 0:00</span>
        </span>
      </div>

      <!-- Action Row - Placed directly above the viewfinder preview -->
      <div class="space-y-2">
        <button id="startRecordBtn" class="w-full bg-slate-100 text-slate-950 font-bold text-sm rounded-xl py-3.5 px-4 flex items-center justify-center gap-2.5 transition active:scale-95">
          <i data-lucide="video" class="w-4.5 h-4.5 text-indigo-600 fill-indigo-100"></i>
          <span>Start Recording Camera</span>
        </button>

        <button id="stopRecordBtn" class="hidden w-full bg-red-600 text-white font-bold text-sm rounded-xl py-3.5 px-4 flex items-center justify-center gap-2.5 transition active:scale-95 animate-pulse">
          <i data-lucide="square" class="w-4 h-4 fill-white"></i>
          <span>Stop Recording</span>
        </button>

        <button id="uploadBtn" disabled class="w-full bg-slate-950 text-slate-600 border border-slate-800 font-bold text-sm rounded-xl py-3.5 px-4 flex items-center justify-center gap-2.5 transition active:scale-95 opacity-50">
          <i data-lucide="upload" class="w-4.5 h-4.5"></i>
          <span>Queue & Upload Video</span>
        </button>
      </div>

      <div id="recordStatus" class="hidden text-[11px] font-bold text-slate-400 bg-slate-900 border border-slate-800/80 p-2 text-center rounded-xl font-mono leading-none"></div>

      <!-- Viewfinder box -->
      <div class="relative rounded-2xl border border-slate-800 bg-black overflow-hidden w-full aspect-video flex items-center justify-center shadow-inner">
        <!-- Live Camera element -->
        <video id="camera" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none"></video>

        <!-- Video Player preview -->
        <video id="preview" controls playsinline class="absolute inset-0 w-full h-full object-cover z-10 hidden"></video>

        <!-- Placeholder state screen -->
        <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 p-6 text-center bg-slate-950">
          <div class="p-3 bg-slate-900 border border-slate-800 rounded-full text-slate-500 mb-2.5">
            <i data-lucide="video-off" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-bold text-slate-300">Camera Inactive</span>
          <span class="text-[10px] text-slate-500 mt-0.5 max-w-[220px]">Trigger 'Start' button to boot environment viewfinder</span>
        </div>
      </div>
    </div>

    <!-- Step 3: Status Toast Log -->
    <div id="statusToast" class="hidden bg-slate-950 text-slate-300 border border-slate-800/60 p-3.5 rounded-xl flex items-center justify-between text-xs font-mono">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 bg-indigo-400 rounded-full animate-pulse"></span>
        <span id="statusToastText">Transmitting...</span>
      </div>
      <span id="statusToastProgress" class="text-indigo-400 font-bold">0%</span>
    </div>

    <!-- Step 4: Queue List Widget -->
    <div class="bg-slate-950/60 rounded-2xl border border-slate-800 shadow-xl overflow-hidden">
      <div class="px-4 py-3 bg-slate-950/90 border-b border-slate-800/80 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span id="queueBadge" class="inline-flex items-center justify-center bg-slate-800 text-slate-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full font-mono">0</span>
          <h3 class="text-xs font-bold text-slate-200 uppercase tracking-widest">Process Queue</h3>
        </div>
        <button id="clearCompletedBtn" class="hidden text-[11px] text-indigo-400 hover:text-indigo-300 font-bold uppercase tracking-wider transition">
          Clear Done
        </button>
      </div>

      <div id="queueContainer" class="divide-y divide-slate-800/60 max-h-80 overflow-y-auto">
        <div id="emptyQueueMsg" class="p-8 text-center text-slate-500 flex flex-col items-center justify-center gap-1">
          <i data-lucide="video" class="w-6 h-6 text-slate-600 mb-1"></i>
          <p class="font-bold">No items queued</p>
          <p class="text-[10px] text-slate-600 max-w-[200px]">Completed items automatically stream inside Google Drive folder.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Scanner Dialog wrapper -->
  <div id="scannerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
    <div class="relative bg-slate-900 border border-slate-800 text-white rounded-2xl p-6 w-full max-w-sm shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="camera" class="w-5 h-5 text-indigo-400"></i>
          <span class="text-sm font-semibold tracking-tight">Scan Barcode / QR ID</span>
        </div>
        <button id="closeScannerBtn" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="relative rounded-xl overflow-hidden bg-black aspect-square border border-slate-800">
        <div id="reader" style="width: 100%; height: 100%;"></div>
      </div>

      <div class="mt-4 text-center">
        <p class="text-xs text-slate-400">Align barcode or QR code central to viewfinder.</p>
        <button id="cancelScannerBtn" class="mt-4 w-full py-2 px-4 bg-slate-850 border border-slate-800 text-slate-300 rounded-xl text-sm font-medium">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdbSsY_5Elu7u_vJUrkwrnbbbUZXvYjPnQ9v6oqZvMs2OO89tzajlPODNGQmcbnznp/exec";

    // DOM selectors
    const folderSelect = document.getElementById("folderSelect");
    const lockBtn = document.getElementById("lockBtn");
    const lockBtnText = document.getElementById("lockBtnText");
    const folderNameInput = document.getElementById("folderName");
    const scanBtn = document.getElementById("scanBtn");
    const startRecordBtn = document.getElementById("startRecordBtn");
    const stopRecordBtn = document.getElementById("stopRecordBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const recordingIndicator = document.getElementById("recordingIndicator");
    const timerTxt = document.getElementById("timerTxt");
    const recordStatus = document.getElementById("recordStatus");
    const camera = document.getElementById("camera");
    const preview = document.getElementById("preview");
    const cameraPlaceholder = document.getElementById("cameraPlaceholder");
    const statusToast = document.getElementById("statusToast");
    const statusToastText = document.getElementById("statusToastText");
    const statusToastProgress = document.getElementById("statusToastProgress");
    
    // Scan modal elements
    const scannerModal = document.getElementById("scannerModal");
    const closeScannerBtn = document.getElementById("closeScannerBtn");
    const cancelScannerBtn = document.getElementById("cancelScannerBtn");
    
    // Queue elements
    const queueContainer = document.getElementById("queueContainer");
    const emptyQueueMsg = document.getElementById("emptyQueueMsg");
    const queueBadge = document.getElementById("queueBadge");
    const clearCompletedBtn = document.getElementById("clearCompletedBtn");

    // State managers
    let isFolderLocked = false;
    let cameraStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedFile = null;
    let uploadQueue = [];
    let isUploading = false;
    let html5QrcodeScanner = null;
    let recordingTimer = null;
    let durationSeconds = 0;

    // IndexedDB Setup for standalone
    const DB_NAME = "DamageVideoTerminalDB";
    const STORE_DRAFTS = "drafts";
    const STORE_QUEUE = "queue";

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 2);
        request.onupgradeneeded = (event) => {
          const db = request.result;
          if (!db.objectStoreNames.contains(STORE_DRAFTS)) {
            db.createObjectStore(STORE_DRAFTS);
          }
          if (!db.objectStoreNames.contains(STORE_QUEUE)) {
            db.createObjectStore(STORE_QUEUE, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveDraftToDB(file, infoText) {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_DRAFTS, "readwrite");
        const store = tx.objectStore(STORE_DRAFTS);
        if (!file) {
          store.delete("active_draft");
        } else {
          store.put({ file, recordInfoText: infoText }, "active_draft");
        }
      } catch (e) {
        console.error("Failed to save draft to DB", e);
      }
    }

    async function getDraftFromDB() {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_DRAFTS, "readonly");
        const store = tx.objectStore(STORE_DRAFTS);
        return new Promise((resolve) => {
          const req = store.get("active_draft");
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        console.error("Failed to get draft from DB", e);
        return null;
      }
    }

    async function saveQueueItemToDB(item) {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_QUEUE, "readwrite");
        const store = tx.objectStore(STORE_QUEUE);
        store.put(item);
      } catch (e) {
        console.error("Failed to save queue item", e);
      }
    }

    async function removeQueueItemFromDB(id) {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_QUEUE, "readwrite");
        const store = tx.objectStore(STORE_QUEUE);
        store.delete(id);
      } catch (e) {
        console.error("Failed to delete queue item", e);
      }
    }

    async function loadQueueFromDB() {
      try {
        const db = await initDB();
        const tx = db.transaction(STORE_QUEUE, "readwrite");
        const store = tx.objectStore(STORE_QUEUE);
        return new Promise((resolve) => {
          const req = store.getAll();
          req.onsuccess = () => {
            const allItems = req.result || [];
            // Auto-clear success items on load/launch
            const completedItems = allItems.filter(item => item.status === 'success');
            completedItems.forEach(item => store.delete(item.id));
            
            const remaining = allItems.filter(item => item.status !== 'success');
            resolve(remaining);
          };
          req.onerror = () => resolve([]);
        });
      } catch (e) {
        console.error("Failed to load queue", e);
        return [];
      }
    }

    // Initialize UI state
    async function init() {
      lucide.createIcons();
      
      const savedFolder = localStorage.getItem("selectedFolder");
      const savedLock = localStorage.getItem("folderLocked");
      
      if (savedFolder) {
        folderSelect.value = savedFolder;
      }
      if (savedLock === "true") {
        isFolderLocked = true;
        folderSelect.disabled = true;
        lockBtnText.textContent = "Unlock";
        lockBtn.classList.add("bg-amber-950/40", "border-amber-900/60", "text-amber-300");
        // update lock icon dynamically
        lockBtn.querySelector('i').setAttribute('data-lucide', 'unlock');
        lucide.createIcons();
      }

      // Load DB drafts and queue
      try {
        const remainingQueue = await loadQueueFromDB();
        uploadQueue = remainingQueue;
        renderQueue();
        processNextQueue();

        const draft = await getDraftFromDB();
        if (draft && draft.file) {
          recordedFile = draft.file;
          cameraPlaceholder.classList.add("hidden");
          preview.src = URL.createObjectURL(draft.file);
          preview.classList.remove("hidden");
          recordStatus.innerHTML = draft.recordInfoText;
          recordStatus.classList.remove("hidden");
          validateForm();
        }
      } catch (err) {
        console.error("Error loading persisted DB in init: ", err);
      }
    }

    init();

    // Folder selection & Locks
    folderSelect.addEventListener("change", (e) => {
      localStorage.setItem("selectedFolder", e.target.value);
    });

    lockBtn.addEventListener("click", () => {
      if (isFolderLocked) {
        isFolderLocked = false;
        folderSelect.disabled = false;
        localStorage.setItem("folderLocked", "false");
        lockBtnText.textContent = "Lock";
        lockBtn.classList.remove("bg-amber-950/40", "border-amber-900/60", "text-amber-300");
        lockBtn.querySelector('i').setAttribute('data-lucide', 'lock');
      } else {
        isFolderLocked = true;
        folderSelect.disabled = true;
        localStorage.setItem("folderLocked", "true");
        localStorage.setItem("selectedFolder", folderSelect.value);
        lockBtnText.textContent = "Unlock";
        lockBtn.classList.add("bg-amber-950/40", "border-amber-900/60", "text-amber-300");
        lockBtn.querySelector('i').setAttribute('data-lucide', 'unlock');
      }
      lucide.createIcons();
    });

    // Scanner Controls
    scanBtn.addEventListener("click", () => {
      scannerModal.classList.remove("hidden");
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          folderNameInput.value = decodedText;
          closeScanner();
          validateForm();
        },
        () => {} // scan frame pass
      ).catch(err => {
        alert("Camera Error: " + err.message);
        closeScanner();
      });
    });

    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          html5QrcodeScanner = null;
        }).catch(() => {});
      }
      scannerModal.classList.add("hidden");
    }

    closeScannerBtn.addEventListener("click", closeScanner);
    cancelScannerBtn.addEventListener("click", closeScanner);

    // Validation
    function validateForm() {
      const hasFile = recordedFile !== null;
      const hasId = folderNameInput.value.trim() !== "";
      
      if (hasFile && hasId) {
        uploadBtn.removeAttribute("disabled");
        uploadBtn.classList.remove("bg-slate-950", "text-slate-600", "border-slate-800", "opacity-50");
        uploadBtn.classList.add("bg-indigo-600", "text-white", "hover:bg-indigo-500");
      } else {
        uploadBtn.setAttribute("disabled", "true");
        uploadBtn.classList.add("bg-slate-950", "text-slate-600", "border-slate-800", "opacity-50");
        uploadBtn.classList.remove("bg-indigo-600", "text-white", "hover:bg-indigo-500");
      }
    }

    folderNameInput.addEventListener("input", validateForm);

    // Recording Loops
    startRecordBtn.addEventListener("click", async () => {
      try {
        recordedFile = null;
        saveDraftToDB(null, ""); // Clear active draft record
        recordedChunks = [];
        preview.classList.add("hidden");
        preview.src = "";
        recordStatus.classList.add("hidden");
        validateForm();

        cameraPlaceholder.classList.add("hidden");
        camera.classList.remove("hidden");

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: 1280, height: 720 },
          audio: true
        });

        camera.srcObject = cameraStream;

        let options = { mimeType: "video/webm", videoBitsPerSecond: 800000 };
        try {
          mediaRecorder = new MediaRecorder(cameraStream, options);
        } catch (e) {
          mediaRecorder = new MediaRecorder(cameraStream);
        }

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          clearInterval(recordingTimer);
          recordingIndicator.classList.add("hidden");

          const blob = new Blob(recordedChunks, { type: "video/webm" });
          recordedFile = new File([blob], "Video.webm", { type: "video/webm" });

          camera.classList.add("hidden");
          camera.srcObject = null;

          preview.src = URL.createObjectURL(blob);
          preview.classList.remove("hidden");

          const infoTxtHtml = `✅ Recorded: ${(recordedFile.size / 1024 / 1024).toFixed(1)} MB`;
          recordStatus.innerHTML = infoTxtHtml;
          recordStatus.classList.remove("hidden");

          // Save draft to IndexedDB
          saveDraftToDB(recordedFile, infoTxtHtml);

          if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
          }

          startRecordBtn.classList.remove("hidden");
          stopRecordBtn.classList.add("hidden");
          validateForm();
        };

        // UI transitions
        startRecordBtn.classList.add("hidden");
        stopRecordBtn.classList.remove("hidden");
        recordingIndicator.classList.remove("hidden");

        // Timer
        durationSeconds = 0;
        timerTxt.innerText = "REC 0:00";
        recordingTimer = setInterval(() => {
          durationSeconds++;
          const m = Math.floor(durationSeconds / 60);
          const s = durationSeconds % 60;
          timerTxt.innerText = `REC ${m}:${s.toString().padStart(2, '0')}`;
        }, 1000);

        mediaRecorder.start();

      } catch (err) {
        alert("Camera Permission / Connection Error: " + err.message);
        cameraPlaceholder.classList.remove("hidden");
        camera.classList.add("hidden");
        startRecordBtn.classList.remove("hidden");
        stopRecordBtn.classList.add("hidden");
        recordingIndicator.classList.add("hidden");
      }
    });

    stopRecordBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    });

    // Upload & Queue Controls
    uploadBtn.addEventListener("click", () => {
      if (!recordedFile || !folderNameInput.value.trim()) return;

      const item = {
        id: Math.random().toString(36).substring(2, 9),
        file: recordedFile,
        folder: folderSelect.value,
        folderName: folderNameInput.value.trim(),
        status: 'pending',
        timestamp: new Date()
      };

      saveDraftToDB(null, ""); // Clear active draft record
      saveQueueItemToDB(item); // Persist queued item record

      uploadQueue.push(item);
      
      // Reset video previews & fields
      recordedFile = null;
      preview.classList.add("hidden");
      preview.src = "";
      cameraPlaceholder.classList.remove("hidden");
      recordStatus.classList.add("hidden");
      validateForm();

      renderQueue();
      processNextQueue();
    });

    function renderQueue() {
      // Clear container but keep empty message placeholder
      queueContainer.innerHTML = "";
      queueBadge.innerText = uploadQueue.length;

      if (uploadQueue.length === 0) {
        queueContainer.appendChild(emptyQueueMsg);
        clearCompletedBtn.classList.add("hidden");
        return;
      }

      // Check if any completed exist
      const hasCompleted = uploadQueue.some(q => q.status === 'success');
      if (hasCompleted) {
        clearCompletedBtn.classList.remove("hidden");
      } else {
        clearCompletedBtn.classList.add("hidden");
      }

      uploadQueue.forEach(item => {
        const div = document.createElement("div");
        div.className = `p-3.5 flex flex-col gap-2 transition duration-200 ${item.status === 'uploading' ? 'bg-indigo-950/20' : ''}`;
        
        const dateObj = (item.timestamp instanceof Date) ? item.timestamp : new Date(item.timestamp);
        const timestampStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const sizeStr = (item.file.size / 1024 / 1024).toFixed(1) + ' MB';

        let statusIcon = '<div class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>';
        if (item.status === 'success') statusIcon = '<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>';
        if (item.status === 'failed') {
          statusIcon = `
            <div class="flex items-center gap-1.5">
              <button onclick="retryQueueItem('${item.id}')" class="p-1 rounded-md text-indigo-400 hover:text-indigo-300 hover:bg-slate-900 transition duration-150 cursor-pointer" title="Retry upload">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              </button>
              <i data-lucide="x-circle" class="w-5 h-5 text-red-400"></i>
            </div>
          `;
        }
        if (item.status === 'uploading') statusIcon = '<i data-lucide="refresh-cw" class="w-5 h-5 text-indigo-400 animate-spin"></i>';

        div.innerHTML = `
          <div class="flex items-center justify-between gap-3 font-sans">
            <div class="flex items-center gap-3">
              <div class="p-2 rounded-xl border border-slate-805 bg-slate-900 text-slate-400 shrink-0">
                <i data-lucide="video" class="w-4 h-4"></i>
              </div>
              <div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-300 font-sans">Form ${item.folder}</span>
                  <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-indigo-950 border border-indigo-900/30 text-indigo-300 font-sans">ID: ${item.folderName}</span>
                  <span class="text-[10px] text-slate-500 font-mono">${timestampStr}</span>
                </div>
                <p class="text-[11px] text-slate-400 font-mono mt-0.5 leading-none">${item.file.name} (${sizeStr})</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              ${statusIcon}
              ${item.status !== 'uploading' ? `
                <button onclick="removeQueueItem('${item.id}')" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-300 hover:bg-slate-900 transition duration-150 cursor-pointer">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              ` : ''}
            </div>
          </div>
        `;

        if (item.status === 'failed') {
          const errorDiv = document.createElement("div");
          errorDiv.className = "flex items-center justify-between gap-2 mt-1 bg-red-950/30 border border-red-900/30 p-1.5 rounded-lg";
          errorDiv.innerHTML = `
            <p class="text-[10px] font-semibold text-red-00 flex items-center gap-1 font-mono leading-tight">
              ⚠️ ${item.error || 'Server error'}
            </p>
            <button onclick="retryQueueItem('${item.id}')" class="px-2 py-1 select-none text-[9px] font-extrabold uppercase tracking-wide bg-indigo-600 hover:bg-indigo-500 text-white rounded transition h-6 flex items-center gap-1 shrink-0 cursor-pointer">
              <i data-lucide="refresh-cw" class="w-2.5 h-2.5"></i>
              <span>Retry</span>
            </button>
          `;
          div.appendChild(errorDiv);
        }

        queueContainer.appendChild(div);
      });

      lucide.createIcons();
    }

    window.removeQueueItem = function(id) {
      removeQueueItemFromDB(id);
      uploadQueue = uploadQueue.filter(item => item.id !== id);
      renderQueue();
    };

    window.retryQueueItem = function(id) {
      const item = uploadQueue.find(q => q.id === id);
      if (item) {
        item.status = 'pending';
        delete item.error;
        saveQueueItemToDB(item);
        renderQueue();
        processNextQueue();
      }
    };

    clearCompletedBtn.addEventListener("click", () => {
      const completed = uploadQueue.filter(item => item.status === 'success');
      completed.forEach(item => removeQueueItemFromDB(item.id));
      uploadQueue = uploadQueue.filter(item => item.status !== 'success');
      renderQueue();
    });

    async function processNextQueue() {
      if (isUploading || uploadQueue.length === 0) return;

      const nextItem = uploadQueue.find(q => q.status === 'pending');
      if (!nextItem) return;

      isUploading = true;
      nextItem.status = 'uploading';
      saveQueueItemToDB(nextItem); // Persist status update
      renderQueue();

      // Toast feedback
      statusToast.classList.remove("hidden");
      statusToastText.innerText = "Preparing transport payload...";
      statusToastProgress.innerText = "20%";

      try {
        const base64Content = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = (e) => resolve(e.target.result.split(",")[1]);
          r.onerror = () => reject(new Error("File conversion failed"));
          r.readAsDataURL(nextItem.file);
        });

        statusToastText.innerText = "Streaming packet logs to Drive...";
        statusToastProgress.innerText = "60%";

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            folder: nextItem.folder,
            folderName: nextItem.folderName,
            fileName: "Video.webm",
            mimeType: "video/webm",
            fileData: base64Content
          })
        });

        const respText = await response.text();
        const result = JSON.parse(respText);

        if (result && result.success) {
          nextItem.status = 'success';
          saveQueueItemToDB(nextItem); // Persist status success
          statusToastText.innerText = "✅ Transmission successfully complete";
          statusToastProgress.innerText = "100%";
        } else {
          throw new Error(result.error || "Drive rejected streaming payload");
        }

      } catch (err) {
        nextItem.status = 'failed';
        nextItem.error = err.message || "Timeout error";
        saveQueueItemToDB(nextItem); // Persist status failed
        statusToastText.innerText = `❌ Transmission Failed`;
        statusToastProgress.innerText = "ERR";
      } finally {
        isUploading = false;
        renderQueue();
        
        // Hide toast briefly after success/fail
        setTimeout(() => {
          if (!isUploading) {
            statusToast.classList.add("hidden");
          }
        }, 3000);

        // Chain loop
        processNextQueue();
      }
    }
  </script>
</body>
</html>
